        analytes: [Potassium]
        observed: 6.2 mmol/L
        reference: 3.5 - 5.1 mmol/L
        severity: critical
        machine_summary: Potassium 6.2 mmol/L breaches the critical high threshold.
    not_resulted: []
    narrative:
      summary: One result is outside its printed range. A doctor reviews this report before you receive it.
