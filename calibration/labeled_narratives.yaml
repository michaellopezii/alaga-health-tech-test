        analytes: [SGPT]
        observed: 58.0 U/L
        reference: 0.0 - 50.0 U/L
        severity: mild
        machine_summary: SGPT 58.0 U/L is high against the printed range.
    not_resulted: [FBS, HbA1c, Free T3, Free T4]
    narrative:
      summary: One result is slightly outside its printed range, and everything else on this panel is completely normal.
      next_step: Raise this at your next routine visit.
      blocks:
        - block_id: b1
          explains_finding_id: F1
          text: Your SGPT was measured at 58.0 U/L against a printed range of 0.0 - 50.0 U/L.

  - id: cal-15
