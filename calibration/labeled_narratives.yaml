        analytes: [Triglycerides]
        observed: 260.0 mg/dL
        reference: "< 150.0 mg/dL"
        severity: mild
        machine_summary: Triglycerides 260.0 mg/dL is high against the printed range.
    not_resulted: []
    narrative:
      summary: One result is outside its printed range. A doctor reviews this report before you receive it.
      next_step: Raise this at your next routine visit.
