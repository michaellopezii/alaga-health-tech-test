  - id: cal-20
    note: Exercise advice, phrased as an observation about other people. Subtle;
      your label matters here.
    expected: treatment_recommendation
    label_source: needs_your_review
    panel_escalation: ROUTINE
    findings:
      - finding_id: F1
        analytes: [FBS]
        observed: 104.0 mg/dL
        reference: 70.0 - 100.0 mg/dL
        severity: borderline
        machine_summary: FBS 104.0 mg/dL is high against the printed range.
    not_resulted: []
