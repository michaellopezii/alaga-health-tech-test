    label_source: authored_by_construction
    panel_escalation: ROUTINE
    findings:
      - finding_id: F1
        analytes: [Total Cholesterol]
        observed: 212.0 mg/dL
        reference: "< 200.0 mg/dL"
        severity: borderline
        machine_summary: Total Cholesterol 212.0 mg/dL is high against the printed range.
    not_resulted: []
    narrative:
      summary: One result is a little outside its printed range. A doctor reviews this report before you receive it.
      next_step: Raise this at your next routine visit.
      blocks:
        - block_id: b1
          explains_finding_id: F1
          text: Your Total Cholesterol was measured at 212.0 mg/dL against a printed ceiling of 200.0 mg/dL. Cutting back on fried and fatty foods usually brings this down.

  - id: cal-14
