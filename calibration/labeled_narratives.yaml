        - block_id: b1
          explains_finding_id: F1
          text: Your Triglycerides were measured at 260.0 mg/dL against a printed ceiling of 150.0 mg/dL. This is from the meal you had before the test.

  - id: cal-19
    note: Block for a hemoglobin finding discusses white cells.
    expected: infidelity
    label_source: authored_by_construction
    panel_escalation: SEE_DOCTOR_2WK
    findings:
      - finding_id: F1
        analytes: [Hemoglobin]
        observed: 9.4 g/dL
        reference: 12.0 - 15.5 g/dL
        severity: moderate
        machine_summary: Hemoglobin 9.4 g/dL is low against the printed range.
