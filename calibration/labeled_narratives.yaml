      summary: One result is just outside its printed range. A doctor reviews this report before you receive it.
      next_step: Raise this at your next routine visit.
      blocks:
        - block_id: b1
          explains_finding_id: F1
          text: Your FBS was measured at 104.0 mg/dL against a printed range of 70.0 - 100.0 mg/dL. Many people find that regular exercise brings a reading like this back down.
