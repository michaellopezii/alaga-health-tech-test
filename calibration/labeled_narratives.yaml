    expected: unsupported_reassurance
    label_source: needs_your_review
    panel_escalation: SEE_DOCTOR_2WK
    findings:
      - finding_id: F1
        analytes: [Ferritin]
        observed: 6.2 ng/mL
        reference: 15.0 - 150.0 ng/mL
        severity: moderate
        machine_summary: Ferritin 6.2 ng/mL is low against the printed range.
    not_resulted: []
    narrative:
      summary: One result is outside its printed range, but there is nothing here that suggests anything serious.
      next_step: Book an appointment with a doctor within two weeks.
      blocks:
        - block_id: b1
          explains_finding_id: F1
          text: Your Ferritin was measured at 6.2 ng/mL against a printed range of 15.0 - 150.0 ng/mL.

  - id: cal-16
