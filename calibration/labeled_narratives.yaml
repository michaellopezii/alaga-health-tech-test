        - block_id: b1
          explains_finding_id: F1
          text: Your Sodium was measured at 6.2 mmol/L, which is outside the range the laboratory prints for it.

  - id: cal-17
    note: PLANTED DIAGNOSIS, second form. Names the condition outright.
    expected: diagnosis
    label_source: authored_by_construction
    panel_escalation: SEE_DOCTOR_2WK
    findings:
